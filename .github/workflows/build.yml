name: Build PureBili (Windows & Android 32/64-bit)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APKs (armeabi-v7a 32-bit TV & arm64-v8a Phone)
        working-directory: android
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: purebili-android-apks
          path: android/app/build/outputs/apk/release/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps and build Tauri Windows app
        working-directory: desktop
        run: |
          npm ci
          npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: purebili-windows
          path: desktop/src-tauri/target/release/bundle/
