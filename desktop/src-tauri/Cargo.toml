[package]
name = "purebili"
version = "0.1.0"
description = "PureBili - Only following creators and favorites"
authors = ["PureBili"]
edition = "2021"

[lib]
name = "purebili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "0.7"
futures-util = "0.3"
md-5 = "0.10"
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
urlencoding = "2.1"
url = "2"
anyhow = "1"
bytes = "1"
